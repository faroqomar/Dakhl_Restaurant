<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>دفتر · حسابات المطعم</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="model.js"></script>
  <script defer src="numbers.js"></script>
  <script defer src="suppliers.js"></script>
  <script defer src="renderer.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="التنقل الرئيسي">
      <div class="brand"><div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></div><strong>دفتر</strong></div>
      <p class="brand-subtitle">حسابات المطعم</p>
      <p class="nav-label">مساحة العمل</p>
      <nav id="navigation">
        <button data-view="expenses" class="nav-item active"><span data-icon="ledger"></span>المصاريف اليومية</button>
        <button data-view="suppliers" class="nav-item"><span data-icon="supplier"></span>الموردون</button>
        <button data-view="payments" class="nav-item"><span data-icon="transfer"></span>التسديدات</button>
        <button data-view="cash" class="nav-item"><span data-icon="wallet"></span>القاصة</button>
        <button data-view="categories" class="nav-item"><span data-icon="grid"></span>الخانات</button>
        <button data-view="settings" class="nav-item"><span data-icon="settings"></span>البيانات والنسخ</button>
      </nav>
      <div class="sidebar-bottom"><div class="account"><span class="avatar">م</span><div><strong>حسابات المطعم</strong><small>مساحة خاصة على جهازك</small></div></div><div id="save-status" class="save-status" role="status"><span class="status-dot"></span>جارٍ فتح الحسابات…</div></div>
    </aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="drawer-host"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
