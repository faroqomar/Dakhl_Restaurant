<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect this Mac · Dakhl</title>
<style>body{font:16px system-ui;color:#17231d;background:#f8faf8;max-width:480px;margin:15vh auto;padding:24px}h1{font-size:26px;font-weight:600}p{color:#5b6861;line-height:1.6}button{font:inherit;background:#174c37;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer;margin:12px 8px 0 0}.secondary{background:white;color:#174c37;border:1px solid #d8e1da}small{display:block;color:#647169;margin-top:24px;line-height:1.6}</style>
<h1>Connect this Mac</h1><p>Run your development tests and benchmarks from the private dashboard. Execution stays on this Mac.</p>
<button id="site">Open private dashboard</button><button id="local" class="secondary">Open local dashboard</button><small>The connection code is single-use. Close this page after connecting. No app push or merge is performed here.</small>
<script>const connection=/*CONNECTION*/{};function openDashboard(base){location.href=base+'#bridge='+encodeURIComponent(connection.bridge)+'&pair='+encodeURIComponent(connection.code)}document.querySelector('#site').onclick=()=>openDashboard(connection.site);document.querySelector('#local').onclick=()=>openDashboard(connection.bridge+'/');</script>
