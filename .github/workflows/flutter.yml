name: Flutter baseline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Dakhl_Restaurant

jobs:
  quality:
    name: Format, analyze, unit and widget tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: Dakhl_Restaurant
      - name: Checkout independently owned engine at consumer pin
        uses: ./Dakhl_Restaurant/.github/actions/checkout-madar
        with:
          repository: ${{ vars.MADAR_ENGINE_REPOSITORY }}
          token: ${{ secrets.MADAR_ENGINE_READ_TOKEN || github.token }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: Dakhl_Restaurant/.fvmrc
          channel: stable
      - run: dart pub get --enforce-lockfile
        working-directory: Madar_Engine/packages/application
      - run: dart analyze
        working-directory: Madar_Engine/packages/application
      - run: flutter pub get --enforce-lockfile
        working-directory: Madar_Engine/packages/flutter_adapters
      - run: flutter analyze --no-pub
        working-directory: Madar_Engine/packages/flutter_adapters
      - run: flutter test --no-pub
        working-directory: Madar_Engine/packages/flutter_adapters
      - run: dart run tool/verify_boundaries.dart ../Dakhl_Restaurant
        working-directory: Madar_Engine
      - run: python3 scripts/check-engine.py
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  android:
    name: Android debug build
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: Dakhl_Restaurant
      - name: Checkout independently owned engine at consumer pin
        uses: ./Dakhl_Restaurant/.github/actions/checkout-madar
        with:
          repository: ${{ vars.MADAR_ENGINE_REPOSITORY }}
          token: ${{ secrets.MADAR_ENGINE_READ_TOKEN || github.token }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: Dakhl_Restaurant/.fvmrc
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug --no-pub

  apple:
    name: ${{ matrix.target }} development build
    needs: quality
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [macos, ios]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: Dakhl_Restaurant
      - name: Checkout independently owned engine at consumer pin
        uses: ./Dakhl_Restaurant/.github/actions/checkout-madar
        with:
          repository: ${{ vars.MADAR_ENGINE_REPOSITORY }}
          token: ${{ secrets.MADAR_ENGINE_READ_TOKEN || github.token }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: Dakhl_Restaurant/.fvmrc
          channel: stable
      - run: xcodebuild -version
      - run: flutter pub get --enforce-lockfile
      - name: macOS development build
        if: matrix.target == 'macos'
        run: flutter build macos --debug --no-pub
      - name: iOS simulator build
        if: matrix.target == 'ios'
        run: flutter build ios --simulator --debug --no-codesign --no-pub
