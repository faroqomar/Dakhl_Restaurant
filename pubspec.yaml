name: dakhl_restaurant
description: Isolated offline development baseline for Dakhl_Restaurant.
publish_to: none
version: 0.0.0+1

environment:
  sdk: '>=3.13.7 <3.14.0'
  flutter: '>=3.47.8 <3.48.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: 13.3.0
  path_provider: 2.1.6
  path: 1.9.1
  pdf: 3.13.1
  printing: 5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/fonts/SOURCE.md
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
