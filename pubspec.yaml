name: dakhl_restaurant
description: Isolated offline development baseline for Dakhl_Restaurant.
publish_to: none
version: 0.0.0+1

environment:
  sdk: '>=3.13.7 <3.14.0'
  flutter: '>=3.47.8 <3.48.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.1.1
  madar_application:
    path: ../Madar_Engine/packages/application
  madar_domain:
    path: ../Madar_Engine/packages/domain
  madar_data:
    path: ../Madar_Engine/packages/data
  madar_flutter_adapters:
    path: ../Madar_Engine/packages/flutter_adapters
  madar_icu_collation:
    path: ../Madar_Engine/packages/icu_collation
  path_provider: 2.1.6
  path: 1.9.1
  pdf: 3.13.1

  crypto: 3.0.8 # Exact snapshot identity and import fixture hashing.
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  printing: 5.15.1 # Integration-only native PDF raster evidence.
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ui/
    - assets/fonts/OFL.txt
    - assets/fonts/SOURCE.md
    - assets/fonts/Inter-OFL.txt
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
